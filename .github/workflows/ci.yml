name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-debate-arena

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-debate-arena/package-lock.json

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Aucune clé API n'est nécessaire : les tests de contrat des providers
      # dirigent les SDK vers un serveur HTTP local.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
